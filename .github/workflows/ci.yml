name: CI

'on':
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install WDK 26100
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2335869' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'The WDK installer does not have a valid Microsoft signature.'
          }
          $process = Start-Process $installer -ArgumentList '/features', '+', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WDK installation failed with exit code $($process.ExitCode)." }
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$kitRoot\Include\10.0.26100.0\km\offreg.h") -or
              -not (Test-Path "$kitRoot\Lib\10.0.26100.0\km\x64\offreg.lib") -or
              -not (Test-Path "$kitRoot\Redist\10.0.26100.0\offreg\x64\offreg.dll")) {
            throw 'The WDK Offline Registry payload was not installed.'
          }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:native
      - run: npm run test:integration
      - run: npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-reg-vsix
          path: "*.vsix"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: vscode-reg-vsix
          path: release
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath release/*.vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.vsix --generate-notes --verify-tag
