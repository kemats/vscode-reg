name: CI

'on':
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:native
      - run: npm run test:integration
      - run: npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-reg-vsix
          path: "*.vsix"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: vscode-reg-vsix
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.vsix --generate-notes --verify-tag
